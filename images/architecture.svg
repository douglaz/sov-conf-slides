<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f7931a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9aa4b2"/></marker>
  </defs>
  <!-- containers -->
  <rect x="10" y="10" width="300" height="540" rx="16" fill="#12161c" stroke="#3a4250" stroke-width="2"/>
  <text x="30" y="42" font-size="20" fill="#9aa4b2" letter-spacing="2">YOUR PHONE</text>
  <rect x="870" y="10" width="320" height="540" rx="16" fill="#12161c" stroke="#3a4250" stroke-width="2"/>
  <text x="890" y="42" font-size="20" fill="#9aa4b2" letter-spacing="2">YOUR SERVER · NIXOS</text>
  <!-- phone boxes -->
  <rect x="30" y="60" width="260" height="110" rx="12" fill="#1f2630" stroke="#f7931a" stroke-width="3"/>
  <text x="160" y="104" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">Farseed</text>
  <text x="160" y="138" font-size="19" fill="#c9d1d9" text-anchor="middle">agent + keys, in the browser</text>
  <rect x="30" y="218" width="260" height="88" rx="12" fill="#161b22" stroke="#3a4250" stroke-width="2"/>
  <text x="160" y="256" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Phoenix</text>
  <text x="160" y="286" font-size="20" fill="#c9d1d9" text-anchor="middle">your wallet</text>
  <rect x="30" y="344" width="260" height="76" rx="12" fill="#161b22" stroke="#3a4250" stroke-width="2"/>
  <text x="160" y="378" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Chat</text>
  <text x="160" y="404" font-size="20" fill="#c9d1d9" text-anchor="middle">your requests</text>
  <rect x="30" y="446" width="260" height="88" rx="12" fill="#161b22" stroke="#3a4250" stroke-width="2"/>
  <text x="160" y="484" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Zeus</text>
  <text x="160" y="514" font-size="20" fill="#c9d1d9" text-anchor="middle">node remote</text>
  <!-- middle boxes -->
  <g fill="#161b22" stroke="#3a4250" stroke-width="2">
    <rect x="490" y="60" width="220" height="76" rx="12"/>
    <rect x="490" y="156" width="220" height="76" rx="12"/>
    <rect x="490" y="252" width="220" height="76" rx="12"/>
    <rect x="490" y="344" width="220" height="76" rx="12"/>
  </g>
  <g text-anchor="middle">
    <text x="600" y="93" font-size="25" font-weight="bold" fill="#ffffff">SSH relay</text>
    <text x="600" y="120" font-size="19" fill="#c9d1d9">carries, can't read</text>
    <text x="600" y="189" font-size="25" font-weight="bold" fill="#ffffff">LNVPS</text>
    <text x="600" y="216" font-size="19" fill="#c9d1d9">server provider</text>
    <text x="600" y="285" font-size="25" font-weight="bold" fill="#ffffff">PPQ</text>
    <text x="600" y="312" font-size="19" fill="#c9d1d9">AI inference</text>
    <text x="600" y="377" font-size="25" font-weight="bold" fill="#ffffff">T3 Code</text>
    <text x="600" y="404" font-size="19" fill="#c9d1d9">chat, hosted sign-in</text>
  </g>
  <!-- server boxes -->
  <rect x="890" y="60" width="280" height="110" rx="12" fill="#1f2630" stroke="#f7931a" stroke-width="3"/>
  <text x="1030" y="104" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">Hermes</text>
  <text x="1030" y="138" font-size="20" fill="#c9d1d9" text-anchor="middle">agent on the server</text>
  <rect x="890" y="446" width="280" height="88" rx="12" fill="#161b22" stroke="#3a4250" stroke-width="2"/>
  <text x="1030" y="484" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Bitcoin Core · lnd</text>
  <text x="1030" y="514" font-size="20" fill="#c9d1d9" text-anchor="middle">your node</text>
  <!-- what the agents do: orange solid -->
  <g stroke="#f7931a" stroke-width="3" fill="none" marker-end="url(#o)">
    <path d="M290 98 L488 98"/>
    <path d="M710 98 L888 98"/>
    <path d="M290 132 L488 186"/>
    <path d="M290 158 L488 276"/>
    <path d="M900 170 L712 278"/>
    <path d="M1090 170 L1090 444"/>
  </g>
  <!-- what you do: grey dashed -->
  <g stroke="#9aa4b2" stroke-width="3" fill="none" stroke-dasharray="9 7" marker-end="url(#g)">
    <path d="M290 250 L488 208"/>
    <path d="M290 276 L488 300"/>
    <path d="M290 382 L488 382"/>
    <path d="M710 382 L940 382 L940 172"/>
    <path d="M290 490 L888 490"/>
  </g>
  <!-- labels -->
  <g font-size="18" fill="#f7931a">
    <text x="389" y="88" text-anchor="middle">SSH, end to end</text>
    <text x="799" y="88" text-anchor="middle">builds it</text>
    <text x="408" y="146">orders</text>
    <text x="724" y="306">its own</text>
    <text x="724" y="327">capped credit</text>
    <text x="1100" y="318">sets up</text>
  </g>
  <g font-size="18" fill="#9aa4b2">
    <text x="318" y="330">Lightning: you tap Pay</text>
    <text x="389" y="372" text-anchor="middle">you ask</text>
    <text x="589" y="480" text-anchor="middle">read-only, over Tailscale</text>
  </g>
  <!-- legend -->
  <g font-size="17" fill="#9aa4b2">
    <path d="M330 534 L380 534" stroke="#f7931a" stroke-width="3"/>
    <text x="390" y="540">what the agents do</text>
    <path d="M590 534 L640 534" stroke="#9aa4b2" stroke-width="3" stroke-dasharray="9 7"/>
    <text x="650" y="540">what you do</text>
  </g>
</svg>
